[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "crr-reference"
version = "0.1.0"
description = "Reference implementation foundation for Computational Resource Routing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.30,<1",
]

[project.scripts]
crr-bootstrap = "crr.bootstrap:main"

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "mypy>=1.10,<3", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.package-data]
crr = ["data/*.json"]
