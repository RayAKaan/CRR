name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Type-check domain and persistence models
        run: mypy src/crr/domain src/crr/models.py src/crr/schemas.py src/crr/unit_registry.py src/crr/database.py src/crr/bootstrap.py
      - run: pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crr
          POSTGRES_PASSWORD: crr
          POSTGRES_DB: crr
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U crr -d crr"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Upgrade database
        env:
          CRR_DATABASE_URL: postgresql+psycopg://crr:crr@localhost:5432/crr
        run: alembic upgrade head
      - name: Downgrade database
        env:
          CRR_DATABASE_URL: postgresql+psycopg://crr:crr@localhost:5432/crr
        run: alembic downgrade base
      - name: Rebuild database
        env:
          CRR_DATABASE_URL: postgresql+psycopg://crr:crr@localhost:5432/crr
        run: alembic upgrade head
      - name: Verify migration model alignment
        env:
          CRR_DATABASE_URL: postgresql+psycopg://crr:crr@localhost:5432/crr
        run: alembic check
      - name: Verify PostgreSQL conformance
        env:
          CRR_DATABASE_URL: postgresql+psycopg://crr:crr@localhost:5432/crr
        run: pytest tests/test_phase1_conformance_closure.py::test_postgresql_parallel_successor_creation_has_one_winner -q
